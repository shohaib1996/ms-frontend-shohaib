# Default values for ts4u-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

namespace: ms-production

limits:
  cpu: 1
  memory: "2Gi"

requests:
  cpu: "500m"
  memory: "1Gi"

host: www.skillbnk.com
redirectHost: skillbnk.com

image:
  name: bh-frontend
  repository: ts4udocker/bh-frontend
  tag: staging-latest
  pullPolicy: IfNotPresent
imagePullSecrets:
  name: regcred